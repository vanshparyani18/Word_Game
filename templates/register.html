{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Register</h2>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       value="{{ username }}"
                       placeholder="At least 5 chars, upper & lowercase">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="At least 5 chars, letter + number + special ($%*&)">
            </div>
            <div class="form-hint">
                <strong>Username:</strong> Min 5 characters, must include uppercase and lowercase letters.<br>
                <strong>Password:</strong> Min 5 characters, must include a letter, a number, and a special character ($, %, *, &).
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="auth-link">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
